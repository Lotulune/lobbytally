server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;

    location = /.well-known/mpgs {
        proxy_pass http://mpgs-server:8080;
        proxy_set_header Host $host;
    }

    location /v1/ {
        proxy_pass http://mpgs-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Operator dashboard + debug; do not fall through to SPA index.html.
    location /admin/ {
        proxy_pass http://mpgs-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }

    location = /openapi.json {
        proxy_pass http://mpgs-server:8080;
        proxy_set_header Host $host;
    }

    location /health/ {
        proxy_pass http://mpgs-server:8080;
        proxy_set_header Host $host;
    }

    # Hashed Vite assets are content-addressed; cache aggressively at browser + any CDN edge.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|svg|webp|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
