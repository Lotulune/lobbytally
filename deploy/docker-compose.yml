services:
  mpgs-init:
    image: ${MPGS_SERVER_IMAGE:-mpgs-server:local}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        install -d -o mpgs -g mpgs -m 0750
        /var/lib/mpgs /var/lib/mpgs/avatars /var/lib/mpgs/backups
        && chown -R mpgs:mpgs /var/lib/mpgs
    volumes:
      - ./runtime:/var/lib/mpgs
    restart: "no"

  mpgs-server:
    build:
      context: ..
      dockerfile: Dockerfile
      target: server
      args:
        MPGS_BUILD_PROFILE: ${MPGS_BUILD_PROFILE:-release}
        MPGS_BUILD_GIT_SHA: ${MPGS_BUILD_GIT_SHA:-unknown}
    image: ${MPGS_SERVER_IMAGE:-mpgs-server:local}
    restart: unless-stopped
    env_file:
      - ./mpgs.env
    environment:
      MPGS_BIND_ADDR: 0.0.0.0:8080
      MPGS_DATABASE_PATH: /var/lib/mpgs/mpgs.db
      MPGS_AVATAR_DIR: /var/lib/mpgs/avatars
      MPGS_SEED_DEMO: "false"
    volumes:
      - ./runtime:/var/lib/mpgs
    ports:
      # Backend-only deployments terminate TLS on the host and proxy here.
      - "127.0.0.1:${MPGS_API_PORT:-18081}:8080"
    expose:
      - "8080"
    depends_on:
      mpgs-init:
        condition: service_completed_successfully

  mpgs-worker:
    image: ${MPGS_SERVER_IMAGE:-mpgs-server:local}
    restart: unless-stopped
    env_file:
      - ./mpgs.env
    environment:
      MPGS_DATABASE_PATH: /var/lib/mpgs/mpgs.db
      MPGS_AVATAR_DIR: /var/lib/mpgs/avatars
      MPGS_SEED_DEMO: "false"
    volumes:
      - ./runtime:/var/lib/mpgs
    entrypoint: ["/usr/local/bin/mpgs-worker-loop"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/mpgs-worker-loop", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      mpgs-init:
        condition: service_completed_successfully
      mpgs-server:
        condition: service_started

  mpgs-web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    image: ${MPGS_WEB_IMAGE:-mpgs-web:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18082:80"
    depends_on:
      - mpgs-server
