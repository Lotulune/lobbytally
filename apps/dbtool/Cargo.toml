[package]
name = "mpgs-dbtool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "mpgs-dbtool"
path = "src/main.rs"

[dependencies]
mpgs-ai = { path = "../../crates/ai" }
mpgs-domain = { path = "../../crates/domain" }
mpgs-recommender = { path = "../../crates/recommender" }
mpgs-steam-source = { path = "../../crates/steam-source" }
mpgs-storage = { path = "../../crates/storage" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
